name: AGRIBAZZER CI / CD Pipeline

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Build & Test Full-Stack Integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate Vite Frontend Build
        run: npm run build

      - name: Run Backend API & Database Audit Tests
        run: node server/audit_test.js
        env:
          NODE_ENV: test
          PORT: 5055
          SESSION_SECRET: test_github_actions_secret_key_12345
