services:
  - type: web
    name: agribazzer-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://agribazzer.vercel.app,http://localhost:5173,http://localhost:3000,capacitor://localhost
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agribazzer-db
          property: connectionString

databases:
  - name: agribazzer-db
    databaseName: agribazzer
    user: agribazzer_admin
    plan: free
    region: oregon
